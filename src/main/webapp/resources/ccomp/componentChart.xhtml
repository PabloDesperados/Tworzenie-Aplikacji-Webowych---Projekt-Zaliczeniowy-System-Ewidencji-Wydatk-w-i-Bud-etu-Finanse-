<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:p="http://primefaces.org/ui">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="leftVisible"/>
        <cc:attribute name="rightVisible"/>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <p:panelGrid id="tablecharts" columns="2" style="width: 100%; margin-top: 20px;">
            <p:lineChart model="#{budgetChartBean.lineModel}"
                         rendered="#{cc.attrs.leftVisible}"
                         style="width: 100%; height: 400px;"/>
            <p:barChart model="#{budgetChartBean.barModel}"
                        rendered="#{cc.attrs.rightVisible}"
                        style="width: 100%; height: 400px;"/>
        </p:panelGrid>
    </cc:implementation>
</html>
