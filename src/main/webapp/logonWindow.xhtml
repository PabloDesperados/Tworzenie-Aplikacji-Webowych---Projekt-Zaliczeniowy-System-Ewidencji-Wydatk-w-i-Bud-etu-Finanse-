<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://xmlns.jcp.org/jsf/passthrough">
    <h:head>
        <title>#{msgs.appTitle} - #{msgs.logon}</title>
    </h:head>
    <h:body style="font-family: Arial, sans-serif; margin-top: 60px;">
        <h:form p:method="post" p:action="j_security_check">
            <table align="center" border="1" cellpadding="10" style="border-collapse: collapse;">
                <tr>
                    <th colspan="2">#{msgs.appTitle}</th>
                </tr>
                <tr>
                    <td>#{msgs.username}:</td>
                    <td><input type="text" name="j_username" id="j_username" size="20"/></td>
                </tr>
                <tr>
                    <td>#{msgs.password}:</td>
                    <td><input type="password" name="j_password" id="j_password" size="20"/></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="#{msgs.logon}"/>
                    </td>
                </tr>
            </table>
        </h:form>
    </h:body>
</html>
