<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ccomp="http://java.sun.com/jsf/composite/ccomp"
                template="./template/masterTemplate.xhtml">

    <ui:define name="content">
        <!-- Punkt 4: Prezentacja danych ze wszystkich 3 komponentow zarzadzanych -->
        <p:panel header="#{msgs.welcome}" style="margin-bottom: 15px;">
            <h:panelGrid columns="1" cellpadding="4">
                <h:outputText value="Komponent Aplikacji (@ApplicationScoped): #{applicationController.appVersion} (#{applicationController.currency})"/>
                <h:outputText value="Komponent Sesji (@SessionScoped + @Inject): #{sessionController.dataFromReferenceComponent}"/>
                <h:outputText value="Komponent Widoku (@ViewScoped): #{dashboardViewBean.combinedSummary}"/>
            </h:panelGrid>
            <h:form style="margin-top: 8px;">
                <p:commandButton value="Zwieksz licznik widoku (@ViewScoped)"
                                 action="#{dashboardViewBean.incrementCounter()}"
                                 update="@form"
                                 icon="pi pi-refresh"/>
            </h:form>
        </p:panel>

        <!-- Punkt 6: Tabela danych w kolekcji z modyfikacja, dodawaniem i usuwaniem (standardowy submit bez AJAX) -->
        <p:panel header="Punkt 6: Kategorie budzetowe (tabela h:dataTable - operacje na kolekcji bez AJAX)">
            <h:form id="classicTableForm">
                <h:dataTable value="#{budgetChartBean.categoriesList}" var="cat"
                             border="1" cellpadding="6" cellspacing="0"
                             style="width: 100%; border-collapse: collapse;">
                    <h:column>
                        <f:facet name="header">ID</f:facet>
                        <h:outputText value="#{cat.id}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Kategoria</f:facet>
                        <h:inputText value="#{cat.categoryName}" rendered="#{cat.edited}"/>
                        <h:outputText value="#{cat.categoryName}" rendered="#{not cat.edited}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Kwota (PLN)</f:facet>
                        <h:inputText value="#{cat.amount}" rendered="#{cat.edited}"/>
                        <h:outputText value="#{cat.amount}" rendered="#{not cat.edited}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Operacje (Tryb edycji / Dodaj / Usun / Zapisz)</f:facet>
                        <h:selectBooleanCheckbox value="#{cat.edited}" onclick="submit()"/>
                        <h:outputText value=" Edytuj "/>
                        <h:commandButton value="Zapisz" action="#{budgetChartBean.editCategory()}"/>
                        <h:outputText value=" "/>
                        <h:commandButton value="Dodaj wiersz" action="#{budgetChartBean.addCategory()}"/>
                        <h:outputText value=" "/>
                        <h:commandButton value="Usun" action="#{budgetChartBean.deleteCategory(cat)}"/>
                    </h:column>
                </h:dataTable>
            </h:form>
        </p:panel>

        <!-- Komponent zlozony wykresow (Zadanie 8, pkt 6i) -->
        <ccomp:componentChart leftVisible="#{dashboardViewBean.showLineChart}"
                              rightVisible="#{dashboardViewBean.showBarChart}"/>
    </ui:define>
</ui:composition>
